# Builds and tests the app on GitHub's macOS runners. The repository on GitHub is a
# push mirror of the GitLab project; every mirrored push to main and every v* tag
# runs this. Until the Apple signing material exists (MESHSAT-1331) the result is
# an unsigned .ipa for sideloading plus a simulator build.
name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MeshSat
  SIMULATOR: "platform=iOS Simulator,name=iPhone 16,OS=latest"

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Version
        id: version
        run: |
          V=$(grep -oE '^MARKETING_VERSION *= *[0-9.]+' Config/Version.xcconfig | grep -oE '[0-9.]+$')
          B=$(grep -oE '^CURRENT_PROJECT_VERSION *= *[0-9]+' Config/Version.xcconfig | grep -oE '[0-9]+$')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "MeshSat $V ($B)"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            Packages/MeshSatKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project MeshSat.xcodeproj -scheme "$SCHEME"

      - name: Package tests (macOS, MeshSatApple)
        run: set -o pipefail; swift test --package-path Packages/MeshSatApple 2>&1 | tail -40

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test -project MeshSat.xcodeproj -scheme "$SCHEME" \
            -destination "$SIMULATOR" -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tail -200

      - name: Release build, unsigned
        run: |
          set -o pipefail
          xcodebuild build -project MeshSat.xcodeproj -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -100
          V="${{ steps.version.outputs.version }}"
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MeshSat.app Payload/
          zip -qr "MeshSat-${V}-unsigned.ipa" Payload
          ls -la "MeshSat-${V}-unsigned.ipa"

      - name: Simulator build
        run: |
          set -o pipefail
          xcodebuild build -project MeshSat.xcodeproj -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "$SIMULATOR" -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO | tail -50
          V="${{ steps.version.outputs.version }}"
          (cd build-sim/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/MeshSat-${V}-simulator.zip" MeshSat.app)
          ls -la "MeshSat-${V}-simulator.zip"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: MeshSat-${{ steps.version.outputs.version }}
          path: |
            MeshSat-*-unsigned.ipa
            MeshSat-*-simulator.zip
            TestResults.xcresult
          retention-days: 14

      - name: Attach to the GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "MeshSat iOS $TAG" --prerelease --notes-file fastlane/metadata/en-US/release_notes.txt
          gh release upload "$TAG" MeshSat-*-unsigned.ipa MeshSat-*-simulator.zip --clobber
