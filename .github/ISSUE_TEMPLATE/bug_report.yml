name: Bug Report
description: Report a software bug in MeshSat iOS
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS Version
      placeholder: "17.6"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone Model
      placeholder: "iPhone 13, iPhone SE (2020), etc."
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Affected Transport
      options:
        - Meshtastic BLE
        - Iridium via the node
        - Hub
        - APRS
        - Reticulum
        - All / General
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Setup > Advanced > Diagnostics exports them
      render: shell
